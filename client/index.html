<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/profile-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alibek Khakim — full-stack developer, game developer and 3D designer. Projects, tech stack and contacts."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Alibek Khakim — Developer Portfolio</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Loading screen: shown until the app and its fonts are ready
         (see src/lib/ready.ts). Styled here so it paints before the bundle. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0b0f14;
        color: #e8edf4;
        font: 600 clamp(1.25rem, 3vw, 1.75rem) ui-monospace, Consolas, monospace;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        transition: opacity 0.35s ease;
      }
      [data-theme='light'] #loader {
        background: #f7f8fc;
        color: #17233d;
      }
      #loader.loader--done {
        opacity: 0;
        pointer-events: none;
      }
      #loader i {
        font-style: normal;
        animation: loader-dot 1.2s steps(1) infinite;
      }
      #loader i:nth-child(2) {
        animation-delay: 0.2s;
      }
      #loader i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes loader-dot {
        0%,
        60% {
          opacity: 1;
        }
        61%,
        100% {
          opacity: 0.15;
        }
      }
      /* "Press Start": shown once loading is done. The click is also what
         lets the browser play the start sound. */
      #loader-start {
        padding: 14px 22px;
        border: 2px solid currentColor;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-family: var(--font-display, ui-monospace, Consolas, monospace);
        font-size: clamp(0.8rem, 2.4vw, 1.1rem);
        line-height: 1.5;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        animation: loader-blink 1.1s steps(1) infinite;
      }
      /* The button is focused automatically (any key starts), so it keeps
         blinking while focused; only hovering fills it in. */
      #loader-start:focus {
        outline: none;
      }
      #loader-start:hover {
        background: currentColor;
        animation: none;
      }
      #loader-start:hover span {
        color: #0b0f14;
      }
      [data-theme='light'] #loader-start:hover span {
        color: #f7f8fc;
      }
      #loader [hidden] {
        display: none;
      }
      @keyframes loader-blink {
        0%,
        60% {
          opacity: 1;
        }
        61%,
        100% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader i,
        #loader-start {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <span id="loader-status" role="status"
        ><span id="loader-text">Loading</span><i>.</i><i>.</i><i>.</i></span
      >
      <button id="loader-start" type="button" data-sound="none" hidden>
        <span id="loader-start-text">Press Start</span>
      </button>
    </div>
    <script>
      // Loading text in the visitor's language.
      try {
        var words = { ru: ['Загрузка', 'Нажмите старт'], kk: ['Жүктелуде', 'Бастау үшін басыңыз'] };
        var l = localStorage.getItem('lang') || navigator.language.slice(0, 2).toLowerCase();
        if (words[l]) {
          document.getElementById('loader-text').textContent = words[l][0];
          document.getElementById('loader-start-text').textContent = words[l][1];
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
