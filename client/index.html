<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/profile-logo.jpg" />
    <link rel="apple-touch-icon" href="/profile-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alibek Khakim — full-stack developer, game developer and 3D designer. Projects, tech stack and contacts."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Alibek Khakim — Developer Portfolio</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Loading screen: shown until the app and its fonts are ready
         (see src/lib/ready.ts). Styled here so it paints before the bundle. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0b0f14;
        color: #e8edf4;
        font: 600 clamp(1.25rem, 3vw, 1.75rem) ui-monospace, Consolas, monospace;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        transition: opacity 0.35s ease;
      }
      [data-theme='light'] #loader {
        background: #f7f8fc;
        color: #17233d;
      }
      #loader.loader--done {
        opacity: 0;
        pointer-events: none;
      }
      #loader i {
        font-style: normal;
        animation: loader-dot 1.2s steps(1) infinite;
      }
      #loader i:nth-child(2) {
        animation-delay: 0.2s;
      }
      #loader i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes loader-dot {
        0%,
        60% {
          opacity: 1;
        }
        61%,
        100% {
          opacity: 0.15;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status">
      <span><span id="loader-text">Loading</span><i>.</i><i>.</i><i>.</i></span>
    </div>
    <script>
      // Loading text in the visitor's language.
      try {
        var words = { ru: 'Загрузка', kk: 'Жүктелуде' };
        var l = localStorage.getItem('lang') || navigator.language.slice(0, 2).toLowerCase();
        if (words[l]) document.getElementById('loader-text').textContent = words[l];
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
