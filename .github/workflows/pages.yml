# Builds the site in client/ and publishes it to GitHub Pages on every push
# to main. Needs Settings -> Pages -> Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # The site lives at /<repository>/, so every address needs that prefix.
      - run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
      # GitHub Pages serves 404.html for addresses it has no file for, such as
      # /projects. Giving it the app lets those links open the right page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
